[project]
name = "consult"
version = "0.1.0"
description = "Consult backend application"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.62",
  "django>=6.0.7",
  "django-environ>=0.14.0",
  "django-filter>=26.1",
  "django-redis>=7.0.0",
  "django-rq>=4.1.1",
  "django-simple-history>=3.13.0",
  "django-storages>=1.14.6",
  "djangorestframework>=3.17.1",
  "djangorestframework-simplejwt[crypto]>=5.5.1",
  "drf-nested-routers>=0.95.3",
  "drf-orjson-renderer>=1.8.0",
  "drf-spectacular==0.30.0",
  "factory_boy>=3.3.3",
  "gunicorn>=26.0.0",
  "i-dot-ai-utilities[auth]>=0.6.0",
  "openai>=2.52.0",
  "pgvector>=0.5.0",
  "psycopg>=3.3.4",
  "pydantic>=2.13.4",
  "pytest-random-order>=1.2.0",
  "sentry-sdk[django,redis,rq]>=2.66.1",
  "themefinder",
  "werkzeug==3.1.8",
]

[dependency-groups]
dev = [
  "django-extensions>=4.1",
  "pydot>=4.0.1",
  "django-test-migrations>=1.6.0",
  "django-types>=0.24.0",
  "freezegun>=1.5.5",
  "honcho>=2.0.0",
  "moto>=5.2.2",
  "mypy>=2.3.0",
  "pre-commit>=4.6.1",
  "pytest-lazy-fixtures>=1.4.0",
  "ruff>=0.16.2",
  "pytest-django>=4.14.0",
  "django-webtest>=1.9.14",
]

[tool.uv]
exclude-newer = "P14D"
# Use explicit UTC timestamps, not bare dates: uv renders bare dates in the
# local timezone, which re-dirties uv.lock on non-UTC machines (see make install).
exclude-newer-package = {"i-dot-ai-utilities" = "2026-06-05T00:00:00Z", "pydantic-settings" = "2026-07-02T00:00:00Z", "cryptography" = "2026-07-02T00:00:00Z", "langchain" = "2026-07-02T00:00:00Z", "langsmith" = "2026-07-02T00:00:00Z"}
override-dependencies = [
  "cryptography>=49.0.0",
  "langchain-core>=1.3.3",
]

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django_rq.job".msg = "Use rq_context.job instead, so context_id propagates into the worker"
"django_rq.get_queue".msg = "Use an rq_context.job-decorated function's .enqueue()/.delay() instead, so context_id propagates into the worker"
"django_rq.enqueue".msg = "Use an rq_context.job-decorated function's .enqueue()/.delay() instead, so context_id propagates into the worker"
"sentry_sdk.capture_exception".msg = "Use sentry_context.capture_handled_sentry_exception instead, so before_send doesn't silently drop it"

[tool.ruff.lint.per-file-ignores]
"rq_context.py" = ["TID251"]
"sentry_context.py" = ["TID251"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.test"
filterwarnings = [
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  "ignore::FutureWarning:.*huggingface_hub.*",
  "ignore::SyntaxWarning:.*sentence_transformers.*",
]

[tool.mypy]
files = '**/*.py'
exclude = ['^consultations/migrations/']

[tool.bandit]
exclude = "*/.cruft.json"

[tool.uv.sources]
themefinder = { workspace = true }
