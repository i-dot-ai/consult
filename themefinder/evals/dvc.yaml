stages:
  evaluate:
    foreach: ${evals}
    do:
      cmd: >-
        AUTO_EVAL_MODEL=${item.model}
        THEMEFINDER_EVAL_DATASET_SOURCE=${item.dataset_source}
        THEMEFINDER_EVAL_ARTEFACT_STORE=${item.artefact_store}
        uv run --extra eval python run_eval.py
        --component ${key} --dataset ${item.dataset}
      deps:
        - run_eval.py
        - evaluation.py
        - component_catalog.py
        - component_runner.py
        - config.py
        - datasets.py
        - eval_types.py
        - evaluators.py
        - metrics.py
        - prompts.py
        - settings.py
        - components/__init__.py
        - components/registry.py
        - components/${key}.py
        - adapters
        - utils
        - ../src/themefinder
        - ../pyproject.toml
        - ../../uv.lock
        - data/${item.dataset}
      # Tracks mutable remote datasets; bump dataset_revision to rerun a stage
      # when Langfuse data changes outside DVC's local dependency graph.
      params:
        - params.yaml:
            - evals.${key}
      outs:
        - local_eval_runs/${key}/${item.dataset}/results.json:
            cache: false
