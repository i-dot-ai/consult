stages:
  evaluate:
    foreach: ${evals}
    do:
      cmd: >-
        AUTO_EVAL_MODEL=${item.model}
        AUTO_EVAL_JUDGE_MODEL=${judge_model}
        THEMEFINDER_EVAL_DATASET_SOURCE=${backends.dataset_source}
        THEMEFINDER_EVAL_ARTEFACT_STORE=${backends.artefact_store}
        uv run --extra eval python run_eval.py
        --component ${key} --dataset ${dataset.name} --runs ${runs}
      deps:
        - run_eval.py
        - component_runner.py
        - config.py
        - datasets.py
        - eval_types.py
        - metrics.py
        - settings.py
        - components/__init__.py
        - components/registry.py
        - components/${key}.py
        - components/theme_output.py
        - adapters
        - utils
        - ../src/themefinder
        - ../pyproject.toml
        - ../../uv.lock
      params:
        - params.yaml:
            - dataset
            - runs
            - judge_model
            - backends
            - evals.${key}
      outs:
        - local_eval_runs/${key}/${dataset.name}/results.json:
            cache: false
