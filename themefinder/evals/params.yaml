# Runtime configuration for the DVC evaluation pipeline. This is the default
# tracked dataset for all components; update it for a persistent new baseline,
# or override it with `dvc exp run -S themefinder/evals/params.yaml:dataset.name=<dataset>`
# for a run-specific experiment such as a CI smoke test.
#
# Bump dataset.revision when a Langfuse dataset changes: DVC can hash the local
# data directory but cannot detect a mutable remote dataset changing by itself.
dataset:
  name: gambling_XS
  revision: local-2025-07-22

# Times to run every case, for mean/stddev and consistency metrics. Override per
# experiment with `-S params.yaml:runs=<n>`.
runs: 1

evals:
  mapping:
    model: gpt-4.1-sweden-2025-03
    dataset_source: local
    artefact_store: local
  generation:
    model: gpt-4.1-sweden-2025-03
    dataset_source: local
    artefact_store: local
  find_themes:
    model: gpt-4.1-sweden-2025-03
    dataset_source: local
    artefact_store: local
  condensation:
    model: gpt-4.1-sweden-2025-03
    dataset_source: local
    artefact_store: local
  refinement:
    model: gpt-4.1-sweden-2025-03
    dataset_source: local
    artefact_store: local
