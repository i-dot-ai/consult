name: themefinder evaluation regression test

# Compares eval metrics on gambling_XS to the committed baselines in themefinder/evals/baselines.

on:
  push:
    branches: [main]
    paths:
      - 'themefinder/evals/**'
      - 'themefinder/src/themefinder/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: themefinder-eval-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/themefinder-eval-run.yml
    permissions: write-all
    with:
      tier: regression
    secrets: inherit

  notify-failure:
    needs: regression
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ ThemeFinder regression eval failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *ThemeFinder regression eval failed*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
