name: PR review load balancer

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  report-review-load:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Comment with team review load
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSULT_TEAM_READ_TOKEN: ${{ secrets.CONSULT_TEAM_READ_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_load_balancer.py
